  location /dicom-web/ {
      proxy_pass http://webquiz-orthanc-server.onrender.com;
      
      proxy_http_version 1.1;
      proxy_set_header Host webquiz-orthanc-server.onrender.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # THIS IS THE KEY:
      # If the backend sends a redirect pointing to the internal server,
      # Nginx rewrites the Location header to point back to the proxy.
      proxy_redirect https://webquiz-orthanc-server.onrender.com/ /dicom-web/;
      proxy_redirect http://webquiz-orthanc-server.onrender.com/ /dicom-web/;

      # Force CORS headers on all responses
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

      # Handle Preflight
      if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' '*';
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
          add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
          add_header 'Access-Control-Max-Age' 86400;
          return 204;
      }
  }
}