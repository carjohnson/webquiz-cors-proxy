resolver 8.8.8.8;

error_log /var/log/nginx/error.log debug;

log_format basic '$time_local | $request_method $uri | status=$status | host=$host';

server {
    listen 10000;

    absolute_redirect off;
    port_in_redirect off;

    access_log /var/log/nginx/redirect.log basic;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /dicom-web/ {
        proxy_pass https://webquiz-orthanc-server.onrender.com/dicom-web/;

        proxy_ssl_server_name on;      # Required for SNI — Render needs this
        proxy_ssl_verify off;          # Optional; set to 'on' if you have CA certs

        proxy_set_header Host webquiz-orthanc-server.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_redirect off;

        # Debug headers
        add_header X-Debug-Path $uri always;
        add_header X-Debug-Host $host always;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            return 204;
        }
    }

    # Redirect bare /dicom-web to /dicom-web/ only if actually needed
    location = /dicom-web {
        return 301 /dicom-web/;
    }
}




