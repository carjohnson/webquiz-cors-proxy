# Change the location to match the prefix, but strip it when passing to backend
location /dicom-web/ {
    proxy_pass http://webquiz-orthanc-server.onrender.com;
    
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # # --- THE MAGIC FIX ---
    # # Intercept any redirect pointing to the backend and rewrite it to the proxy
    # proxy_redirect https://webquiz-orthanc-server.onrender.com/ https://webquiz-cors-proxy.onrender.com/;
    # proxy_redirect http://webquiz-orthanc-server.onrender.com/ https://webquiz-cors-proxy.onrender.com/;
    
    # # Ensure all responses are HTTPS
    # proxy_redirect http:// https://;

  proxy_redirect https://webquiz-orthanc-server.onrender.com/dicom-web/ /dicom-web/;
  proxy_redirect http://webquiz-orthanc-server.onrender.com/dicom-web/ /dicom-web/;
  proxy_redirect default;


    # CORS Headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
    }
}
}