# Debugging: Log the specific variables Nginx sees
resolver 8.8.8.8;

# 1. This handles the /pacs-proxy/ path (the one you are calling)
location ~ ^/pacs-proxy(.*) {
    set $path $1;
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web$path;
    
    proxy_set_header Host webquiz-cors-proxy.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    
    # Disable Nginx's internal redirect handling entirely
    absolute_redirect off;
    port_in_redirect off;
    
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    if ($request_method = 'OPTIONS') { return 204; }
}

# 2. THIS IS THE KEY: Stop Nginx from looking for local files for /dicom-web/
location /dicom-web/ {
    # If a request for /dicom-web/ reaches here, proxy it to Orthanc immediately
    # This prevents the "open() ... failed" error.
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web/;
    
    proxy_set_header Host webquiz-cors-proxy.onrender.com;
    
    add_header 'Access-Control-Allow-Origin' '*' always;
    # ... (rest of CORS headers)
}
# Handle the root
location = / {
    return 200 "Proxy is active";
    add_header Content-Type text/plain;
}
# 3. Handle /health
location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
}

}


