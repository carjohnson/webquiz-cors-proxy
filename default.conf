# Use Google's DNS to resolve upstream hostnames dynamically.
# Required when proxy_pass uses a variable or a hostname that may change IP
# (which is common on Render, since services get dynamic IPs).
resolver 8.8.8.8;

error_log /var/log/nginx/error.log debug;

# Custom log format that captures the key info for debugging proxy/redirect issues.
# Logs: timestamp | method + URI | HTTP status | incoming host header
log_format basic '$time_local | $request_method $uri | status=$status | host=$host';

server {
    # Render expects services to listen on port 10000 (not 80/443).
    listen 10000;

    # Prevents nginx from adding the port number to redirect URLs it generates.
    # Without this, a redirect to /dicom-web/ could become
    # http://your-proxy.onrender.com:10000/dicom-web/ which breaks in browsers.
    absolute_redirect off;
    port_in_redirect off;

    access_log /var/log/nginx/redirect.log basic;

    # Simple health check endpoint.
    # Render (and most platforms) ping this to confirm the service is alive.
    location = /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Intercept all DICOMweb requests and proxy them to Orthanc.
    # The trailing slash on both the location and proxy_pass is important —
    # nginx strips the location prefix (/dicom-web/) from the URI and
    # appends the remainder to the proxy_pass path, so the mapping is 1:1.
    location /dicom-web/ {

        # Must use https:// because Render only accepts HTTPS on its public URLs.
        # Using http:// would cause Render to return a 301 redirect to https://,
        # which nginx would pass back to the client instead of following — 
        # this was the root cause of the original 301 error.
        proxy_pass https://webquiz-orthanc-server.onrender.com/dicom-web/;

        # Enables TLS SNI (Server Name Indication) for the upstream connection.
        # SNI tells the upstream server which hostname is being requested,
        # so it can serve the correct SSL certificate. Required on Render
        # since many services share the same IP address.
        proxy_ssl_server_name on;

        # Skips verification of the upstream SSL certificate.
        # Safe to use here since both services are on Render (trusted internal traffic).
        # Set to 'on' in high-security environments where you can provide CA certs.
        proxy_ssl_verify off;

        # Tells Orthanc which host is being requested.
        # Without this, Orthanc would see your proxy's internal hostname
        # instead of its own public hostname, which can break URL generation.
        proxy_set_header Host webquiz-orthanc-server.onrender.com;

        # Passes the real client IP through to Orthanc.
        # Useful for logging and access control on the Orthanc side.
        proxy_set_header X-Real-IP $remote_addr;

        # Tells Orthanc the original request came in over HTTPS.
        # Orthanc uses this when generating absolute URLs in responses —
        # without it, it might generate http:// URLs that cause mixed-content errors.
        proxy_set_header X-Forwarded-Proto https;

        # Passes the public hostname of the proxy to Orthanc.
        # Lets Orthanc know the original Host header seen by the client.
        proxy_set_header X-Forwarded-Host $host;

        # Prevents nginx from rewriting Location headers in upstream responses.
        # If Orthanc returns a redirect, nginx won't try to remap the URL —
        # it passes it through as-is.
        proxy_redirect off;

        # Inject Orthanc Basic Auth server-side so the browser never needs it
        proxy_set_header Authorization "Basic ${ORTHANC_AUTH_B64}";

        # CORS headers — allow browsers from any origin to make DICOMweb requests.
        # 'always' ensures headers are added even on error responses (4xx, 5xx),
        # which is important so the browser can read the error body.
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # Handle CORS preflight requests.
        # Browsers send an OPTIONS request before cross-origin POST/PUT/DELETE
        # to check what the server allows. We respond immediately with 204 (No Content)
        # and the relevant CORS headers, without forwarding to Orthanc.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            return 204;
        }
    }

    # Redirect the bare path /dicom-web (no trailing slash) to /dicom-web/.
    # Some clients omit the trailing slash; this ensures they still reach
    # the correct location block above.
    location = /dicom-web {
        return 301 /dicom-web/;
    }
}


