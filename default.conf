  location /dicom-web/ {
      # 1. Forward to the backend as-is (no trailing slash here)
      proxy_pass http://webquiz-orthanc-server.onrender.com;
      
      # 2. Standard Headers
      proxy_set_header Host webquiz-orthanc-server.onrender.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;

      # 3. FIX THE REDIRECT:
      # If the backend sends a redirect like 'Location: /studies',
      # this changes it to 'Location: /dicom-web/studies' before the browser sees it.
      proxy_redirect /studies /dicom-web/studies;
      proxy_redirect / /dicom-web/;

      absolute_redirect off;

      # 4. CORS
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
  }
}