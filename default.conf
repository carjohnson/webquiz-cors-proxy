# Debugging: Log the specific variables Nginx sees


# We define exactly ONE way to talk to the backend.
# Everything else (the root, health, etc) is handled separately.

resolver 8.8.8.8;

server {
    listen 10000;
    absolute_redirect off;
    port_in_redirect off;
    # -----------------------
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Everything else goes here
    location / {
        # 1. Strip the prefix /pacs-proxy/ or /dicom-web/ and turn it into /dicom-web/
        # This rewrite happens internally and doesn't send a 301 to the browser
        rewrite ^/(pacs-proxy|dicom-web)(/.*) /dicom-web$2 break;

        # 2. Proxy Pass (Now valid because it's outside an 'if')
        proxy_pass http://webquiz-orthanc-server.onrender.com;
        
        # 3. Headers
        proxy_set_header Host webquiz-cors-proxy.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 4. Kill Redirects
        absolute_redirect off;
        port_in_redirect off;
        proxy_redirect off;

        # 5. CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            return 204;
        }
    }
}

