# Debugging: Log the specific variables Nginx sees
resolver 8.8.8.8;

# We define exactly ONE way to talk to the backend.
# Everything else (the root, health, etc) is handled separately.

location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
}

# This handles both /pacs-proxy/ AND /dicom-web/
# It sends everything to the Orthanc backend and NOTHING ELSE.
location ~ ^/(pacs-proxy|dicom-web)(/.*|$) {
    # 1. Capture the path
    set $path $2; 
    
    # 2. Proxy to Orthanc
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web$path;
    
    # 3. Headers
    proxy_set_header Host webquiz-cors-proxy.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 4. CRITICAL: Stop Nginx from being "smart"
    absolute_redirect off;
    port_in_redirect off;
    proxy_redirect off;

    # 5. CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}


}


