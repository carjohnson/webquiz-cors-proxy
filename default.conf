location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
}


location ~ ^/pacs-proxy(/.*|$) {
    # We use a variable here so that Nginx is forced to use the resolver
    set $backend "webquiz-orthanc-server.onrender.com";
    
    proxy_pass http://$backend/dicom-web$1;
    
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}

}



