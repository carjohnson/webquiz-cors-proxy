location /dicom-web/ {
    # 1. Forward to the backend
    proxy_pass http://webquiz-orthanc-server.onrender.com;
    
    # 2. Standard proxy headers
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 3. Handle the Redirects
    # This ensures that if the backend redirects, the browser 
    # still goes to your proxy, not the internal Orthanc URL.
    proxy_redirect http://webquiz-orthanc-server.onrender.com/ https://webquiz-cors-proxy.onrender.com/;

    # 4. CRITICAL: Force CORS headers on EVERYTHING
    # The 'always' parameter is non-negotiable here.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control' always;

    # 5. Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
  }
}