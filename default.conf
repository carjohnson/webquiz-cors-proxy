# Use ^~ to ensure this block takes priority over any other matches
# Match /pacs-proxy/ OR /pacs-proxy
location ~ ^/pacs-proxy(/.*|$) {
    # Strip the '/pacs-proxy/' prefix (including the slash)
    # The regex ensures we capture the remainder of the path
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web$1;
    
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # FORCE CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # Preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
    # 1. Handle Preflight (OPTIONS) requests immediately
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
    }

    # 2. Proxy the actual data requests
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web/;
    
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 3. Force CORS headers on all successful and error responses
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
}

# Optional: Keep a simple root block for your /health endpoint
location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
}


}



