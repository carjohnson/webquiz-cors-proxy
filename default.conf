location /pacs-proxy/ {
    # Strip /pacs-proxy/ and pass to Orthanc's /dicom-web/
    proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web/;
    
    # 2. Correct Host Header
    proxy_set_header Host webquiz-orthanc-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 3. CRITICAL: Handle the redirect that Orthanc IS sending.
    # Orthanc is sending "Location: /studies". 
    # We must rewrite that to "Location: /dicom-web/studies"
    proxy_redirect /studies /dicom-web/studies;

    # 4. Force CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # 5. Handle OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
    }
}


