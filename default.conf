resolver 8.8.8.8;

server {
    listen 10000;

    absolute_redirect off;
    port_in_redirect off;

    # Exact match for /dicom-web -> redirect to /dicom-web/ only on the proxy host
    location = /dicom-web {
        add_header Content-Type text/plain;
        return 301 /dicom-web/;
    }

    # Exact match for /health
    location = /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Prefix match for everything under /dicom-web/
    location /dicom-web/ {
        # Proxy to Orthanc, keeping the path after /dicom-web/
        proxy_pass http://webquiz-orthanc-server.onrender.com/dicom-web/;

        # Headers to upstream
        proxy_set_header Host webquiz-orthanc-server.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # DO NOT rewrite upstream redirects back to absolute URLs
        proxy_redirect off;

        # Debug headers (optional)
        add_header X-Debug-Path $uri always;
        add_header X-Debug-Host $host always;

        # CORS: always on the proxy response
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            return 204;
        }
    }
}
